name: MinimalAI
version: '${version}'
main: com.minimalai.MinimalAIPlugin
api-version: '1.21'
description: AI combat bots with live RL training via DJL inference
softdepend:
  - ArcaneSigils

commands:
  mai:
    description: MinimalAI command hub
    usage: /mai <model|train|bot|kit|status|stop|help>
    aliases: [minimalai, minai]
    permission: minimalai.use
permissions:
  minimalai.use:
    default: op
