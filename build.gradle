plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.17'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.minimalai'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = "https://repo.luckperms.net/repository/maven-public/" }
}

dependencies {
    paperweight.paperDevBundle("1.21.10-R0.1-SNAPSHOT")

    // DJL - Deep Java Library (Neural Network Inference)
    implementation "ai.djl:api:0.31.0"
    implementation "ai.djl.pytorch:pytorch-engine:0.31.0"
    implementation "ai.djl.pytorch:pytorch-native-cpu:2.5.1"

    compileOnly "io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT"

    // LuckPerms API (provided at runtime by the LP plugin)
    compileOnly "net.luckperms:api:5.4"
}

task generateConstants(type: Exec) {
    commandLine 'python', 'scripts/gen_config.py'
    workingDir projectDir
}

tasks.withType(JavaCompile).configureEach {
    dependsOn generateConstants
    options.encoding = 'UTF-8'
}

shadowJar {
    // Don't relocate DJL - breaks ServiceLoader engine discovery on Paper's classloader
    mergeServiceFiles()
    archiveClassifier.set('')
}

// Ensure reobfJar runs after jar to avoid implicit dependency issues
tasks.named('reobfJar') {
    dependsOn tasks.named('jar')
}
tasks.assemble.dependsOn(tasks.reobfJar)

// Deploy to Paper server plugins folder
def pluginsDir = System.getenv('PAPER_PLUGINS') ?: 'server/plugins'

tasks.register('deploy', Copy) {
    dependsOn shadowJar
    from shadowJar.archiveFile
    into file(pluginsDir)
    rename { "MinimalAI-${version}.jar" }
    doLast {
        println "Deployed to: ${pluginsDir}"
    }
}

processResources {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand(props)
    }
}
