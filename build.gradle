plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://djl.ai/maven/' }
}

dependencies {
    // Minecraft/Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // DJL - Deep Java Library (Neural Network)
    implementation "ai.djl:api:0.31.0"
    implementation "ai.djl.pytorch:pytorch-engine:0.31.0"
    implementation "ai.djl.pytorch:pytorch-native-cpu:2.5.1"

    // Include DJL in the mod jar
    include "ai.djl:api:0.31.0"
    include "ai.djl.pytorch:pytorch-engine:0.31.0"
    include "ai.djl.pytorch:pytorch-native-cpu:2.5.1"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = targetJavaVersion
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

// Auto-deploy to mods folder
def modsDir = System.getenv('MINECRAFT_MODS') ?: "${System.getenv('APPDATA')}/ModrinthApp/profiles/SkyBlock Enhanced - Modern Edition/mods"

task deploy(type: Copy, dependsOn: remapJar) {
    from remapJar.archiveFile
    into file(modsDir)
    doLast {
        println "Deployed to: ${modsDir}"
    }
}

build.finalizedBy(deploy)
